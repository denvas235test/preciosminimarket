<style>
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --ink:#12281F; --muted:#5B6F66; --line:#D5E0DA;
  --green:#0E4D3A; --green-2:#0A3B2C; --sun:#F4B400; --sun-ink:#3A2A00; --warn:#B3261E;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0D1914; --surface:#15251E; --ink:#E8F1EC; --muted:#93A89E; --line:#26382F; --green:#1C7A5B; --green-2:#12513C; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
header{background:var(--green);color:#fff;padding:28px 16px 26px}
header .in{max-width:720px;margin:0 auto}
h1{font:800 clamp(28px,7vw,40px)/1.05 "Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.02em}
header p{margin:0;opacity:.85}
.wrap{padding-top:18px}
.rate-unused{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.rate-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rate-label{color:var(--muted);font-size:14px}
.rate-value{font:800 34px/1 "Bricolage Grotesque",Figtree,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rate-value small{font:500 15px Figtree,sans-serif;color:var(--muted);letter-spacing:0;margin-left:4px}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sun);color:var(--sun-ink)}
.chip.off{background:transparent;border:1.5px solid var(--warn);color:var(--warn)}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.sub div span{display:block;color:var(--muted);font-size:13px}
.sub div b{font:700 18px "Bricolage Grotesque",Figtree,sans-serif;font-variant-numeric:tabular-nums}
.manual{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.manual[hidden]{display:none}
.manual label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.manual .row{display:flex;gap:8px}
input[type=text],input[type=search],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button{font:600 15px Figtree,sans-serif;background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
button:hover{background:var(--green-2)}
.search{margin:20px 0 10px}
.count{color:var(--muted);font-size:14px;margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.name{font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
footer{margin-top:18px;color:var(--muted);font-size:13px}

body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
li{align-items:center}
.info{min-width:0;flex:1}
.name{display:block}
.unit{display:flex;align-items:baseline;gap:8px;margin-top:2px;flex-wrap:wrap}
.bs{font:800 20px/1.1 "Bricolage Grotesque",Figtree,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bs small{font:600 13px Figtree,sans-serif;color:var(--muted);margin-left:3px}
.usd{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.line{display:block;margin-top:4px;font-size:14px;font-weight:600;color:var(--green);font-variant-numeric:tabular-nums}
@media (prefers-color-scheme: dark){ .line{color:#6FD1A8} }
.step{display:flex;align-items:center;gap:6px;flex:none}
.rb{width:44px;height:44px;padding:0;border-radius:50%;font-size:24px;line-height:1;display:inline-flex;align-items:center;justify-content:center;background:var(--green)}
.rb.minus{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.rb.minus:hover{background:var(--bg)}
@media (prefers-color-scheme: dark){ .rb.minus{color:#6FD1A8;border-color:#6FD1A8} }
.step .qty{width:54px;flex:none;text-align:center;padding:10px 4px;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qty::-webkit-outer-spin-button,.qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--green);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.bar[hidden]{display:none}
.bar .in{max-width:720px;margin:0 auto}
.sheet{max-height:38vh;overflow:auto;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:8px}
.sheet[hidden]{display:none}
.sl{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.sl span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.tot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tot .lbl{font-size:14px;opacity:.85}
.tot .big{font:800 30px/1 "Bricolage Grotesque",Figtree,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tot .big small{font:600 15px Figtree,sans-serif;opacity:.85;margin-left:4px}
.tot .usdt{font-size:15px;opacity:.9;font-variant-numeric:tabular-nums;margin-top:2px}
.acts{display:flex;gap:8px;flex:none}
.bar button{background:rgba(255,255,255,.16);padding:11px 14px}
.bar button:hover{background:rgba(255,255,255,.26)}
.bar button.clear{background:var(--sun);color:var(--sun-ink)}
.bar button.clear:hover{background:#e0a600}
.bar input:focus-visible,.bar button:focus-visible{outline-color:#fff}


header .chip{display:inline-block;margin-top:14px;border:0;font:600 13px Figtree,sans-serif;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;cursor:default}
header .chip.ok{background:rgba(255,255,255,.18)}
header .chip.off{background:var(--sun);color:var(--sun-ink);border:0;cursor:pointer}
header .manual{margin-top:12px;padding-top:0;border-top:0}
header .manual label{color:rgba(255,255,255,.85)}
header .manual input{background:rgba(255,255,255,.95);color:#12281F;border-color:transparent}
header .manual button.use{background:var(--sun);color:var(--sun-ink)}

@media (prefers-reduced-motion:no-preference){ .bs{transition:opacity .15s} }
</style>
</head>
<body>
<header><div class="in">
  <h1>Minimarket Amazonas</h1>
  <p>Lista de precios en dólares y bolívares</p>
  <button id="status" type="button" class="chip off" aria-live="polite">Cargando…</button>
  <div class="manual" id="manualBox" hidden>
    <label for="manualInput">Tasa BCV de hoy (Bs por $), solo si no hay conexión:</label>
    <div class="row">
      <input id="manualInput" type="text" inputmode="decimal" placeholder="Ej: 866,56">
      <button id="manualSave" type="button" class="use">Usar</button>
    </div>
  </div>
</div></header>

<main class="wrap">

  <div class="search"><input id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto" autocomplete="off"></div>
  <p class="count" id="count"></p>
  <ul id="list"></ul>
  <footer>Toca + para ir sumando la cuenta. Los precios en Bs se redondean al bolívar.</footer>
</main>


<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="sheet" id="sheet" hidden></div>
    <div class="tot">
      <div>
        <div class="lbl" id="cnt"></div>
        <div class="big"><span id="totBs">0</span><small>Bs</small></div>
        <div class="usdt" id="totUsd"></div>
      </div>
      <div class="acts">
        <button id="toggle" type="button" aria-expanded="false">Ver cuenta</button>
        <button id="clear" type="button" class="clear">Vaciar</button>
      </div>
    </div>
  </div>
</div>

<script>
// ---- Configuración (editar aquí) ----
const RECARGO = 0.04;                 // 4% sobre la tasa BCV
const RESPALDO = 866.56;              // tasa BCV de respaldo si falla la conexión
const API = "https://ve.dolarapi.com/v1/dolares/oficial";
const PRODUCTOS = [
  ["Jabón Ace 400g",1.6],["Jabón panela",1.15],["Mayonesa 175g",2.6],
  ["Salsa tomate 198g",1.8],["Mantequilla 250g",2.4],["Arroz 900g",1.9],
  ["Harina PAN 1k",1.6],["Pasta Corta kilo",2.4],["Aceite litro",3.5],
  ["Salsa Napolitana o albahaca",2.6],["Salsa Boloñesa",2.9],["Espagueti",2.0],
  ["Arroz",1.4],["Sal",1.0],["Azúcar",1.8]
];
// -------------------------------------

const $ = id => document.getElementById(id);
let bcv = null, auto = false;

function fmt(n, dec){
  const s = Number(n).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
  return s.replace(/,/g,"§").replace(/\./g,",").replace(/§/g,".");
}
function store(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
function load(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"") }

const qty = PRODUCTOS.map(()=>0);
const MAXQ = 999;
const tasa = () => bcv * (1 + RECARGO);
const unitBs = i => Math.round(PRODUCTOS[i][1] * tasa());

function rowEl(i){
  const li = document.createElement("li");
  li.dataset.i = i;
  const q = qty[i];
  const info = document.createElement("div"); info.className = "info";
  const name = document.createElement("span"); name.className = "name"; name.textContent = PRODUCTOS[i][0];
  const unit = document.createElement("div"); unit.className = "unit";
  unit.innerHTML = `<span class="bs">${fmt(unitBs(i),0)}<small>Bs</small></span><span class="usd">$${fmt(PRODUCTOS[i][1],2)}</span>`;
  info.append(name, unit);
  if(q > 0){
    const line = document.createElement("span"); line.className = "line";
    line.textContent = `${q} × ${fmt(unitBs(i),0)} = ${fmt(q*unitBs(i),0)} Bs`;
    info.append(line);
  }
  const step = document.createElement("div"); step.className = "step";
  if(q > 0){
    step.innerHTML = `<button type="button" class="rb minus" data-act="dec" aria-label="Quitar uno">−</button>
      <input class="qty" type="number" inputmode="numeric" min="0" max="${MAXQ}" value="${q}" aria-label="Cantidad">
      <button type="button" class="rb" data-act="inc" aria-label="Agregar uno">+</button>`;
  }else{
    step.innerHTML = `<button type="button" class="rb" data-act="inc" aria-label="Agregar">+</button>`;
  }
  li.append(info, step);
  return li;
}

function renderList(){
  const q = norm($("q").value.trim());
  const idx = PRODUCTOS.map((_,i)=>i).filter(i => norm(PRODUCTOS[i][0]).includes(q));
  $("count").textContent = idx.length + (idx.length===1 ? " producto" : " productos");
  const ul = $("list"); ul.textContent = "";
  if(!idx.length){
    const li = document.createElement("li"); li.className = "empty"; li.textContent = "No hay productos con ese nombre."; ul.append(li);
  }else{
    idx.forEach(i => ul.append(rowEl(i)));
  }
}

function renderBar(){
  let items = 0, bs = 0, usd = 0;
  qty.forEach((q,i)=>{ if(q>0){ items += q; bs += q*unitBs(i); usd += q*PRODUCTOS[i][1]; } });
  $("bar").hidden = items === 0;
  $("cnt").textContent = items + (items===1 ? " artículo" : " artículos");
  $("totBs").textContent = fmt(bs,0);
  $("totUsd").textContent = "$" + fmt(usd,2);
  const sheet = $("sheet");
  if(items === 0){ sheet.hidden = true; $("toggle").setAttribute("aria-expanded","false"); $("toggle").textContent = "Ver cuenta"; }
  sheet.textContent = "";
  qty.forEach((q,i)=>{
    if(q<=0) return;
    const d = document.createElement("div"); d.className = "sl";
    const a = document.createElement("span"); a.textContent = `${q} × ${PRODUCTOS[i][0]}`;
    const b = document.createElement("span"); b.textContent = `${fmt(q*unitBs(i),0)} Bs`;
    d.append(a,b); sheet.append(d);
  });
}

function setQty(i, v){
  v = Math.max(0, Math.min(MAXQ, Math.floor(Number(v)) || 0));
  qty[i] = v;
  const old = document.querySelector(`#list li[data-i="${i}"]`);
  if(old) old.replaceWith(rowEl(i));
  renderBar();
}

function render(){
  renderList();
  renderBar();
}

let offline = false;
function setStatus(ok, text){
  offline = !ok;
  const el = $("status"); el.textContent = text; el.className = "chip " + (ok ? "ok" : "off");
  if(ok) $("manualBox").hidden = true;
}

async function init(){
  const saved = parseFloat(load("tasaManual"));
  bcv = isFinite(saved) && saved > 0 ? saved : RESPALDO;
  render();
  try{
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 8000);
    const r = await fetch(API,{signal:ctl.signal, cache:"no-store"}); clearTimeout(t);
    if(!r.ok) throw new Error("http "+r.status);
    const d = await r.json();
    const v = Number(d.promedio);
    if(!isFinite(v) || v<=0) throw new Error("dato inválido");
    bcv = v; auto = true;
    setStatus(true,"Tasa actualizada");
  }catch(e){
    setStatus(false,"Sin conexión: usando tasa guardada");
  }
  render();
}

$("status").addEventListener("click", ()=>{
  if(!offline) return;
  const m = $("manualBox"); m.hidden = !m.hidden;
  if(!m.hidden) $("manualInput").focus();
});
$("q").addEventListener("input", renderList);
$("list").addEventListener("click", e=>{
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const li = b.closest("li"); const i = Number(li.dataset.i);
  setQty(i, qty[i] + (b.dataset.act === "inc" ? 1 : -1));
  const again = document.querySelector(`#list li[data-i="${i}"] [data-act="${b.dataset.act}"]`);
  if(again) again.focus();
});
$("list").addEventListener("change", e=>{
  if(!e.target.classList.contains("qty")) return;
  setQty(Number(e.target.closest("li").dataset.i), e.target.value);
});
$("toggle").addEventListener("click", ()=>{
  const s = $("sheet"); s.hidden = !s.hidden;
  $("toggle").setAttribute("aria-expanded", String(!s.hidden));
  $("toggle").textContent = s.hidden ? "Ver cuenta" : "Ocultar";
});
$("clear").addEventListener("click", ()=>{
  if(!qty.some(q=>q>0)) return;
  if(!confirm("¿Vaciar la cuenta?")) return;
  qty.fill(0); render();
});

$("manualSave").addEventListener("click", ()=>{
  let raw = $("manualInput").value.trim().replace(/\s/g,"");
  if(raw.includes(",")) raw = raw.replace(/\./g,"").replace(",",".");
  const v = parseFloat(raw);
  if(!isFinite(v) || v<=0){ $("manualInput").focus(); return; }
  bcv = v; store("tasaManual", String(v)); $("manualBox").hidden = true; render();
});
init();
</script>
</body>
</html>
